<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/src/store-pages.css"><title>Rooblox — Estoque de contas</title><style>
.inventory{max-width:1120px;margin:0 auto;padding:34px 18px}.hero{margin-bottom:22px}.hero h1{margin:6px 0}.muted{color:#6b7280}.inventory-grid{display:grid;grid-template-columns:380px 1fr;gap:18px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.05)}label{display:block;font-weight:700;margin:14px 0}select,input,textarea{width:100%;box-sizing:border-box;margin-top:7px;border:1px solid #d7dbe2;border-radius:11px;padding:12px;font:inherit;background:#fff}textarea{min-height:150px;resize:vertical}.hint{font-size:12px;color:#6b7280;font-weight:500;margin-top:5px}.primary{border:0;border-radius:11px;padding:12px 16px;background:#111;color:#fff;font-weight:800;cursor:pointer}.primary:disabled{opacity:.5;cursor:not-allowed}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.account{border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#f1f5f9}.danger{border:1px solid #e5e7eb;background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer}.notice{margin-top:10px}.count{font-size:13px;color:#6b7280}@media(max-width:800px){.inventory-grid{grid-template-columns:1fr}.inventory{padding:22px 14px}.panel{padding:17px}.account{align-items:flex-start}}
</style></head><body><header class="top"><a href="/admin.html" class="brand"><img src="/logo.svg" alt="Rooblox"></a><nav><a href="/admin.html">Administração</a><a href="/">Loja</a></nav><a class="cart" href="/admin.html">Voltar</a></header><main id="app"><div class="loading">Verificando acesso…</div></main><script type="module">
import{createClient}from'@supabase/supabase-js';
const url=String(import.meta.env.VITE_SUPABASE_URL||'').replace(/\/+$/,'').replace(/\/rest\/v1$/i,''),key=String(import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY||'');const sb=createClient(url,key);const ADMIN='willianwca2011@gmail.com',app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],accounts=[];
async function init(){const{data}=await sb.auth.getSession(),u=data.session?.user;if(!u||String(u.email).toLowerCase()!==ADMIN){app.innerHTML='<section class="error-page"><h1>Acesso negado</h1><a class="btn" href="/">Voltar</a></section>';return}await load();render()}
async function load(){const[p,a]=await Promise.all([sb.from('products').select('id,name,delivery_type').order('name'),sb.from('product_accounts').select('id,product_id,login,password,extra,status,created_at').order('created_at',{ascending:false})]);if(p.error)throw p.error;if(a.error)throw a.error;products=p.data||[];accounts=a.data||[]}
function render(){app.innerHTML=`<section class="inventory"><div class="hero"><span class="eyebrow">ADMINISTRAÇÃO • ESTOQUE</span><h1>Estoque de contas</h1><p class="muted">Cadastre e organize as contas usadas na entrega automática. O estoque é separado do cadastro do produto para você poder repor contas quando quiser.</p></div><div class="inventory-grid"><section class="panel"><h2>Adicionar contas</h2><p class="muted">Cole várias contas de uma vez no formato <b>nome:senha</b>, uma por linha. Produtos de atendimento não aceitam contas.</p><form id="add"><label>Produto<select name="product_id" required>${products.map(p=>`<option value="${p.id}" data-type="${esc(p.delivery_type)}">${esc(p.name)} • ${esc(p.delivery_type==='digital'?'Digital':'Atendimento')}</option>`).join('')}</select></label><label>Contas<textarea name="bulk" placeholder="conta1:senha1\nconta2:senha2\nconta3:senha3"></textarea><div class="hint">Somente para produtos Digital. Cada linha cria uma conta disponível.</div></label><label>Informação extra (opcional)<input name="extra" maxlength="2000" placeholder="Ex.: região, instruções de acesso..."></label><button class="primary" id="addBtn">Adicionar ao estoque</button><div id="err" class="notice"></div></form></section><section class="panel"><div class="toolbar"><div><h2>Contas cadastradas</h2><div class="count" id="count"></div></div><button class="danger" id="refresh">Atualizar</button></div><div id="list"></div></section></div></section>`;refreshList();document.querySelector('#refresh').onclick=async()=>{await load();render()};document.querySelector('#add').onsubmit=addBulk;document.querySelector('[name=product_id]').onchange=toggleManual;toggleManual()}
function toggleManual(){const sel=document.querySelector('[name=product_id]'),type=sel.selectedOptions[0]?.dataset.type;const btn=document.querySelector('#addBtn'),ta=document.querySelector('[name=bulk]');const manual=type!=='digital';btn.disabled=manual;ta.disabled=manual;ta.placeholder=manual?'Este produto é de atendimento e não possui estoque de contas.':'conta1:senha1\nconta2:senha2';}
function refreshList(){const list=document.querySelector('#list');if(!list)return;document.querySelector('#count').textContent=`${accounts.length} conta(s) • ${accounts.filter(a=>a.status==='available').length} disponível(is)`;list.innerHTML=accounts.map(a=>{const p=products.find(x=>x.id===a.product_id);return `<article class="account"><div><b>${esc(p?.name||'Produto')}</b><div class="count">${esc(a.login)} • ${esc(a.status)}</div></div><div><span class="badge">${esc(a.status)}</span> <button class="danger" data-delete="${a.id}">Excluir</button></div></article>`}).join('')||'<div class="notice">Nenhuma conta cadastrada.</div>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir esta conta do estoque?'))return;const r=await sb.from('product_accounts').delete().eq('id',b.dataset.delete);if(r.error)return alert(r.error.message);await load();refreshList()})}
async function addBulk(e){e.preventDefault();const err=document.querySelector('#err');err.textContent='';const f=new FormData(e.currentTarget),productId=String(f.get('product_id')),p=products.find(x=>x.id===productId);if(p?.delivery_type!=='digital'){err.textContent='Produtos de atendimento não possuem estoque de contas.';return}const rows=String(f.get('bulk')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!rows.length){err.textContent='Cole pelo menos uma conta no formato nome:senha.';return}const payload=[];for(const line of rows){const i=line.indexOf(':');if(i<=0||i===line.length-1){err.textContent=`Formato inválido: ${line}. Use nome:senha, uma por linha.`;return}payload.push({product_id:productId,login:line.slice(0,i).trim(),password:line.slice(i+1).trim(),extra:String(f.get('extra')||'').trim()||null})}const r=await sb.from('product_accounts').insert(payload);if(r.error){err.textContent=r.error.message;return}e.currentTarget.reset();await load();render()}
init().catch(e=>app.innerHTML=`<section class="error-page"><h1>Erro</h1><p>${esc(e.message)}</p></section>`);
</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/src/store-pages.css"><title>Rooblox — Contas do estoque</title></head><body><header class="top"><a href="/admin.html" class="brand"><img src="/logo.svg" alt="Rooblox"></a><nav><a href="/admin.html">Administração</a><a href="/">Loja</a></nav><a class="cart" href="/admin.html">Voltar</a></header><main id="app"><div class="loading">Verificando acesso…</div></main><script type="module">import{createClient}from'@supabase/supabase-js';const url=String(import.meta.env.VITE_SUPABASE_URL||'').replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');const key=String(import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY||'');const sb=createClient(url,key);const ADMIN='willianwca2011@gmail.com';const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],accounts=[];async function init(){const s=await sb.auth.getSession(),u=s.data.session?.user;if(!u||String(u.email).toLowerCase()!==ADMIN){app.innerHTML='<section class="error-page"><h1>Acesso negado</h1><a class="btn" href="/">Voltar</a></section>';return}await load();render()}async function load(){const[p,a]=await Promise.all([sb.from('products').select('id,name,delivery_type').order('name'),sb.from('product_accounts').select('id,product_id,login,password,extra,status,created_at').order('created_at',{ascending:false})]);if(p.error)throw p.error;if(a.error)throw a.error;products=p.data||[];accounts=a.data||[]}function render(){app.innerHTML=`<section class="orders-page"><div class="checkout-head"><span class="eyebrow">ADMINISTRAÇÃO • ESTOQUE</span><h1>Contas para entrega</h1><p>Cadastre as contas que poderão ser selecionadas pelos clientes. As credenciais ficam protegidas até o pagamento ser confirmado.</p></div><section class="panel"><h2>Adicionar conta</h2><form id="add"><label>Produto<select name="product_id" required>${products.map(p=>`<option value="${p.id}">${esc(p.name)} • ${esc(p.delivery_type)}</option>`).join('')}</select></label><label>Login<input name="login" required maxlength="500"></label><label>Senha<input name="password" required maxlength="500"></label><label>Informação extra<textarea name="extra" maxlength="2000"></textarea></label><button class="btn">Adicionar ao estoque</button><div id="err"></div></form></section><section class="panel" style="margin-top:18px"><h2>Estoque atual</h2><div class="orders">${accounts.map(a=>`<article class="order-card"><div class="order-top"><div><b>${esc(products.find(p=>p.id===a.product_id)?.name||'Produto')}</b><small>${esc(a.login)}</small></div><span class="status">${esc(a.status)}</span><button class="btn secondary" data-delete="${a.id}">Excluir</button></div></article>`).join('')||'<div class="notice">Nenhuma conta cadastrada.</div>'}</div></section></section>`;document.querySelector('#add').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const r=await sb.from('product_accounts').insert({product_id:f.get('product_id'),login:String(f.get('login')).trim(),password:String(f.get('password')).trim(),extra:String(f.get('extra')||'').trim()});if(r.error){document.querySelector('#err').textContent=r.error.message;return}await load();render()};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir esta conta do estoque?'))return;const r=await sb.from('product_accounts').delete().eq('id',b.dataset.delete);if(r.error)return alert(r.error.message);await load();render()})}init().catch(e=>app.innerHTML=`<section class="error-page"><h1>Erro</h1><p>${esc(e.message)}</p></section>`);</script></body></html>

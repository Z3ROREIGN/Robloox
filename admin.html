<script type="module">import{createClient}from'@supabase/supabase-js';const u=String(import.meta.env.VITE_SUPABASE_URL||'').replace(/\/+$/,'').replace(/\/rest\/v1$/i,''),k=String(import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY||'');if(u&&k){const sb=createClient(u,k);sb.auth.getSession().then(({data})=>{if(String(data.session?.user?.email||'').toLowerCase()==='willianwca2011@gmail.com'){const add=()=>{if(document.querySelector('[data-inventory-link]'))return;const a=document.createElement('a');a.href='/admin-contas.html';a.dataset.inventoryLink='1';a.textContent='Estoque de contas';a.className='admin-inventory-link';a.style.cssText='position:fixed;right:20px;bottom:20px;z-index:50;padding:12px 16px;border-radius:10px;background:#111;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.15)';document.body.append(a)};setTimeout(add,500)}})}</script>

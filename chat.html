<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimento — Rooblox</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/src/store-pages.css"></head><body><header class="top"><a href="/" class="brand"><img src="/logo.svg" alt="Rooblox"></a><nav><a href="/orders.html">Meus pedidos</a><a href="/">Produtos</a></nav><a class="cart" href="/orders.html">Voltar</a></header><main id="app"><div class="loading">Carregando atendimento…</div></main><script type="module">import{createClient}from'@supabase/supabase-js';const url=String(import.meta.env.VITE_SUPABASE_URL||'').replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');const key=String(import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY||'');const sb=createClient(url,key);const id=new URLSearchParams(location.search).get('id');const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let session;async function init(){const s=await sb.auth.getSession();session=s.data.session;if(!session||!id){app.innerHTML='<section class="error-page"><h1>Acesso indisponível</h1><a class="btn" href="/orders.html">Voltar</a></section>';return}const c=await sb.from('product_chats').select('id,status,order_id').eq('id',id).eq('user_id',session.user.id).maybeSingle();if(c.error||!c.data){app.innerHTML='<section class="error-page"><h1>Atendimento não encontrado</h1><a class="btn" href="/orders.html">Voltar aos pedidos</a></section>';return}render(c.data);await loadMessages();setInterval(loadMessages,3000)}function render(c){app.innerHTML=`<section class="chat-page"><div class="chat-head"><div><span class="eyebrow">ATENDIMENTO</span><h1>Suporte do pedido</h1><p>Converse com a equipe sobre a entrega.</p></div><span class="status">${esc(c.status)}</span></div><div id="messages" class="messages"><div class="loading">Carregando mensagens…</div></div><form id="send" class="chat-send"><input id="message" maxlength="4000" placeholder="Escreva sua mensagem…" autocomplete="off" required><button class="btn">Enviar</button></form></section>`;document.querySelector('#send').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#message'),message=input.value.trim();if(!message)return;const r=await sb.from('product_chat_messages').insert({chat_id:id,sender_id:session.user.id,message});if(r.error){alert(r.error.message);return}input.value='';loadMessages()}}async function loadMessages(){const r=await sb.from('product_chat_messages').select('id,sender_id,message,created_at').eq('chat_id',id).order('created_at');const box=document.querySelector('#messages');if(!box)return;box.innerHTML=(r.data||[]).map(m=>`<div class="message ${m.sender_id===session.user.id?'mine':''}"><p>${esc(m.message)}</p><small>${new Date(m.created_at).toLocaleString('pt-BR')}</small></div>`).join('')||'<div class="empty">Ainda não há mensagens. Envie a primeira.</div>';box.scrollTop=box.scrollHeight}init();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Checkout — Rooblox</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/src/store-pages.css"></head><body><header class="top"><a href="/" class="brand"><img src="/logo.svg" alt="Rooblox"></a><nav><a href="/">Início</a><a href="/#/catalogo">Produtos</a><a href="/orders.html">Meus pedidos</a></nav><a class="cart" href="/">Voltar</a></header><main id="app"></main><script type="module">import{createClient}from'@supabase/supabase-js';const url=String(import.meta.env.VITE_SUPABASE_URL||'').replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');const key=String(import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY||'');const sb=createClient(url,key);const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let cart=JSON.parse(localStorage.getItem('rooblox_cart')||'[]'),session=null,payment=null,watch=null;const render=()=>{const total=cart.reduce((n,x)=>n+Number(x.price)*Number(x.quantity),0);app.innerHTML=`<section class="checkout-page"><div class="checkout-head"><span class="eyebrow">ROOBLOX • CHECKOUT</span><h1>Finalizar compra</h1><p>Seu pedido será vinculado à sua conta e continuará disponível mesmo se você fechar esta página.</p></div><div class="checkout-grid"><section class="panel"><h2>Seu pedido</h2>${cart.length?cart.map((x,i)=>`<div class="order-line"><div><b>${esc(x.name)}</b><small>Quantidade: ${x.quantity} • ${x.accountIds?.length?'Conta selecionada':'Atendimento'}</small></div><strong>${brl(x.price*x.quantity)}</strong><button data-remove="${i}" aria-label="Remover">×</button></div>`).join(''):`<div class="notice">Seu carrinho está vazio.</div>`}<div class="total"><span>Total</span><b>${brl(total)}</b></div></section><section class="panel payment"><h2>Pagamento PIX</h2>${!session?'<div class="notice">Entre na sua conta para continuar.</div>':payment?paymentView(payment):`<label>Nome do pagador<input id="payerName" value="${esc(session.user.user_metadata?.display_name||session.user.email||'')}" maxlength="120"></label><label>CPF <small>obrigatório para gerar o PIX</small><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></label><button id="generate" class="btn" ${cart.length?'':'disabled'}>Gerar PIX</button><div id="err"></div>`}</section></div></section>`;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.remove),1);localStorage.setItem('rooblox_cart',JSON.stringify(cart));render()});document.querySelector('#generate')?.addEventListener('click',generate)};function paymentView(p){const qr=p.qrCodeBase64?(String(p.qrCodeBase64).startsWith('data:')?p.qrCodeBase64:`data:image/png;base64,${p.qrCodeBase64}`):p.qrcodeUrl;return `<div class="payment-status"><span class="status-dot"></span><div><b>PIX aguardando pagamento</b><small>O pedido já está salvo. Você pode fechar esta página e acompanhar em Meus pedidos.</small></div></div>${qr?`<div class="qr"><img src="${esc(qr)}" alt="QR Code PIX"></div>`:'<div class="notice">O QR Code não foi retornado pelo gateway.</div>'}<label>PIX copia e cola<div class="copy-row"><input id="copycode" readonly value="${esc(p.copyPaste||'')}"><button id="copy">Copiar</button></div></label><div id="payment-status" class="notice">Status: ${esc(p.status||'PENDENTE')}</div>`}async function generate(){const err=document.querySelector('#err');err.textContent='Gerando PIX…';const payerDocument=document.querySelector('#cpf').value.replace(/\D/g,'');if(payerDocument.length!==11){err.textContent='Informe um CPF válido.';return}const payerName=document.querySelector('#payerName').value.trim();if(!payerName){err.textContent='Informe o nome do pagador.';return}const{data,error}=await sb.functions.invoke('rooblox-checkout-v2',{body:{items:cart,payerName,payerDocument}});if(error){err.textContent=error.message||'Não foi possível gerar o pagamento.';return}if(data?.error){err.textContent=String(data.error==='payment_gateway_error'?'A MisticPay recusou a criação do PIX. Verifique as credenciais e o webhook.':data.error);return}payment=data;render();startWatch()}function startWatch(){if(watch)clearInterval(watch);if(!payment?.orderId)return;watch=setInterval(async()=>{const r=await sb.from('store_orders').select('id,status').eq('id',payment.orderId).maybeSingle();if(r.data){const s=String(r.data.status);const el=document.querySelector('#payment-status');if(el)el.textContent='Status: '+s;if(['paid','processing'].includes(s.toLowerCase())){clearInterval(watch);localStorage.removeItem('rooblox_cart');const c=await sb.from('product_chats').select('id').eq('order_id',payment.orderId).maybeSingle();setTimeout(()=>{location.href=c.data?.id?'/chat.html?id='+encodeURIComponent(c.data.id):'/orders.html'},700)}}},4000)}document.addEventListener('click',async e=>{if(e.target.id==='copy'){const i=document.querySelector('#copycode');try{await navigator.clipboard.writeText(i.value);e.target.textContent='Copiado!';setTimeout(()=>e.target.textContent='Copiar',1500)}catch{i.select();document.execCommand('copy')}}});(async()=>{const s=await sb.auth.getSession();session=s.data.session;render()})();</script></body></html>

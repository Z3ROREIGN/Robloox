<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070708"><title>Minha conta — Rooblox</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/src/rooblox-clean-black.css?v=20260928-0132"><style>.account-page{max-width:1240px;margin:auto;padding:48px 24px 90px}.account-hero{display:flex;align-items:center;gap:22px;padding:30px;background:linear-gradient(135deg,#151517,#09090a);border:1px solid rgba(255,255,255,.1);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.account-avatar{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:#f4f4f5;color:#080809;font-size:30px;font-weight:900}.account-hero h1{margin:5px 0;color:#fff;font-size:clamp(28px,5vw,44px);letter-spacing:-.045em}.account-hero p{margin:0;color:#929299}.account-logout{margin-left:auto;border:1px solid rgba(255,255,255,.1);background:#101012;color:#ddd;border-radius:12px;padding:12px 18px;font-weight:750;cursor:pointer}.account-section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:64px 0 24px}.account-section-head h2{margin:7px 0;color:#fff;font-size:34px;letter-spacing:-.04em}.account-section-head p{margin:0;color:#85858d}.account-count{padding:9px 13px;border:1px solid rgba(255,255,255,.1);border-radius:999px;color:#aaa;background:#0d0d0f}.account-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.account-tile{position:relative;display:grid;grid-template-columns:50px 1fr 20px;align-items:center;gap:14px;min-height:118px;padding:20px;background:linear-gradient(145deg,#121214,#0b0b0d);border:1px solid rgba(255,255,255,.1);border-radius:18px;color:#fff;text-decoration:none;overflow:hidden;transition:.2s}.account-tile:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2);box-shadow:0 18px 45px rgba(0,0,0,.3)}.account-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#19191c;border:1px solid rgba(255,255,255,.08)}.account-icon svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.account-copy{display:grid;gap:6px}.account-copy strong{font-size:15px}.account-copy small{color:#7e7e86;line-height:1.45}.account-arrow{color:#777;font-size:20px}.account-bottom{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px;border:1px solid rgba(255,255,255,.09);border-radius:20px;background:#101012}.account-bottom h3{margin:5px 0;color:#fff;font-size:22px}.account-bottom p{margin:0;color:#888}.account-loading{min-height:60vh;display:grid;place-items:center;align-content:center;gap:14px;color:#aaa}.account-loading span{width:28px;height:28px;border:2px solid #333;border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite}@keyframes r{to{transform:rotate(360deg)}}@media(max-width:900px){.account-tiles{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.account-page{padding:22px 14px 60px}.account-hero{align-items:flex-start;flex-wrap:wrap}.account-logout{margin-left:0}.account-section-head{padding-top:45px}.account-section-head h2{font-size:28px}.account-tiles{grid-template-columns:1fr}.account-bottom{display:grid}.account-bottom .primary{width:100%;box-sizing:border-box;text-align:center}}</style></head><body><script type="module" src="/src/account-page.js?v=20260928-0132"></script></body></html>

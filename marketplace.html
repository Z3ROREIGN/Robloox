<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Marketplace — Rooblox</title><link rel="stylesheet" href="/src/profile-dashboard.css"><style>body{margin:0;background:var(--bg,#f6f6f7);color:var(--text,#111);font-family:Inter,system-ui,sans-serif}.mk{max-width:1100px;margin:auto;padding:40px 18px}.mk-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.mk-head h1{margin:5px 0;font-size:38px;letter-spacing:-.05em}.mk-head p{color:var(--muted);font-size:12px}.mk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mk-card{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.mk-card span,.mk-card small{display:block;color:var(--muted);font-size:10px}.mk-card b{display:block;margin-top:8px;font-size:26px}.mk-list{margin-top:18px}.mk-row{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-top:1px solid var(--line);font-size:11px}.mk-btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font-size:10px;font-weight:800;text-decoration:none}.mk-btn.dark{background:var(--text);color:var(--surface);border-color:var(--text)}@media(max-width:700px){.mk-grid{grid-template-columns:1fr}.mk-head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="mk"><div class="mk-head"><div><span>MARKETPLACE</span><h1>Área do vendedor</h1><p>Gerencie seus produtos e acompanhe suas vendas.</p></div><a class="mk-btn" href="/#/conta">← Minha conta</a></div><div id="app"><div class="mk-card">Carregando...</div></div></main><script type="module" src="/src/marketplace.js"></script></body></html>

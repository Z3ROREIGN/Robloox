<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus pedidos — Rooblox</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/src/store-pages.css"><link rel="stylesheet" href="/src/store-enhancements.css"></head><body><header class="top"><a href="/" class="brand"><img src="/logo.svg" alt="Rooblox"></a><nav><a href="/">Início</a><a href="/#/catalogo">Produtos</a><a href="/checkout.html">Carrinho</a></nav><a class="cart" href="/#/conta">Minha conta</a></header><main id="app"><div class="loading">Carregando pedidos…</div></main><script type="module">import{createClient}from'@supabase/supabase-js';const url=String(import.meta.env.VITE_SUPABASE_URL||'').replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');const key=String(import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY||'');const sb=createClient(url,key);const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function init(){const s=await sb.auth.getSession();if(!s.data.session){app.innerHTML='<section class="error-page"><h1>Entre na sua conta</h1><p>Seus pedidos ficam vinculados ao seu cadastro.</p><a class="btn" href="/#/login">Entrar</a></section>';return}const uid=s.data.session.user.id;const{data:orders,error}=await sb.from('store_orders').select('id,status,total,created_at,updated_at').eq('user_id',uid).order('created_at',{ascending:false});if(error){app.innerHTML=`<section class="error-page"><h1>Não foi possível carregar</h1><p>${esc(error.message)}</p></section>`;return}let html=`<section class="orders-page"><div class="checkout-head"><span class="eyebrow">MINHA CONTA • PEDIDOS</span><h1>Meus pedidos</h1><p>Todas as compras permanecem registradas aqui.</p></div>${orders?.length?'<div class="orders">':''}${orders?.length?orders.map(o=>`<article class="order-card" data-order="${o.id}"><div class="order-top"><div><b>Pedido #${esc(o.id.slice(0,8).toUpperCase())}</b><small>${new Date(o.created_at).toLocaleString('pt-BR')}</small></div><span class="status">${esc(o.status)}</span><strong>${brl(o.total)}</strong></div><div class="order-body" id="body-${o.id}"><span class="loading-small">Carregando entrega…</span></div></article>`).join('')+'</div>':'<div class="empty"><h2>Nenhum pedido ainda</h2><a class="btn" href="/#/catalogo">Explorar produtos</a></div>'}</section>`;app.innerHTML=html;for(const o of orders||[])loadOrder(o.id)}async function loadOrder(id){const[items,accounts,chat,events]=await Promise.all([sb.from('store_order_items').select('id,name_snapshot,quantity,delivery_type').eq('order_id',id),sb.from('product_accounts').select('id,login,password,extra,status,order_item_id').eq('order_id',id).eq('status','delivered'),sb.from('product_chats').select('id,status').eq('order_id',id).maybeSingle(),sb.from('store_delivery_events').select('status,note,created_at').eq('order_id',id).order('created_at',{ascending:false})]);const box=document.querySelector('#body-'+id);if(!box)return;const statusLabel=s=>({pending:'Aguardando pagamento',paid:'Pagamento confirmado',processing:'Em processamento',delivered:'Entregue',cancelled:'Cancelado',refunded:'Reembolsado'}[String(s).toLowerCase()]||s);box.innerHTML=`<div class="order-timeline">${(events.data||[]).map(e=>`<div><b>${esc(statusLabel(e.status))}</b><span>${e.note?esc(e.note)+' · ':''}${new Date(e.created_at).toLocaleString('pt-BR')}</span></div>`).join('')||'<div><b>'+esc(statusLabel((document.querySelector('[data-order="'+id+'"] .status')||{}).textContent||''))+'</b><span>Atualização do pedido</span></div>'}</div><div class="order-items">${(items.data||[]).map(i=>`<div><b>${esc(i.name_snapshot)}</b><span>${i.quantity}× • ${String(i.delivery_type).toLowerCase()==='manual'?'Atendimento':'Entrega automática'}</span></div>`).join('')}</div>${accounts.data?.length?`<div class="credentials"><b>Contas entregues</b>${accounts.data.map(a=>`<div class="credential"><span><small>Login</small><b>${esc(a.login)}</b></span><span><small>Senha</small><b>${esc(a.password)}</b></span>${a.extra?`<span><small>Extra</small><b>${esc(a.extra)}</b></span>`:''}</div>`).join('')}</div>`:''}${chat.data?`<a class="btn secondary" href="/chat.html?id=${encodeURIComponent(chat.data.id)}">Abrir atendimento</a>`:''}`}init();</script><style>.order-timeline{display:grid;gap:8px;margin:0 0 16px;padding:14px;border:1px solid var(--rx-line,#e4e7ec);border-radius:14px}.order-timeline div{display:grid;gap:3px;padding-left:12px;border-left:2px solid var(--rx-accent,#111827)}.order-timeline span{font-size:12px;color:var(--rx-muted,#667085)}</style><script type="module" src="/src/store-enhancements.js"></script></body></html>
